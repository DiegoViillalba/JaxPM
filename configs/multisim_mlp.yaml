# ==============================================================================
# multisim_mlp.yaml
# Lagrangian MLP multi-sim pre-training — force-resolution correction.
#
# Cosmology: omega_c=0.25, sigma8=0.8 (Planck15 default)
# Data:      generate_data_single.py --mode multisim
#            n_part=128, mesh_lr=128, mesh_hr=256, L=256 Mpc/h, 6 sims, 10 snaps
#
# Each training step samples a random (sim_id, snap) pair from the training set.
# This lets the MLP generalise across simulations AND scale factors.
#
# Pipeline:
#   Step 1: python generate_data_single.py --mode multisim \
#             --out /cosmos_storage/home/diegovillalba/data_multisim128
#   Step 2: python train_cnn_forceres.py  --config configs/multisim_cnn.yaml
#   Step 3: python train_pretrain_forceres.py --config configs/multisim_mlp.yaml
#             (set cnn_checkpoint after step 2)
# ==============================================================================

experiment:
  name: multisim_mlp
  output_dir: runs/multisim_mlp

data:
  data_dir: /cosmos_storage/home/diegovillalba/data_multisim128
  n_part:   128
  mesh_lr:  128
  mesh_hr:  256
  box_size: 256.0

  # sims 0-4 for training, sim 5 held out for validation
  sim_ids_train: [0, 1, 2, 3, 4]
  snaps_train:   [1, 3, 5, 7, 9]    # a ≈ 0.20, 0.40, 0.60, 0.80, 1.00

  sim_ids_val: [5]
  snaps_val:   [0, 2, 4, 6, 8]      # a ≈ 0.10, 0.30, 0.50, 0.70, 0.90

model:
  use_strain:     true
  use_invariants: false
  use_velocity:   true
  n_shell:        0
  env_pool_mode:  mean_var
  hidden_dim:     64
  n_layers:        3

  # Fill this after running Step 2:
  # cnn_checkpoint: /cosmos_storage/home/diegovillalba/JaxPM/runs/multisim_cnn/multisim_cnn/checkpoint.pkl
  cnn_checkpoint: null

training:
  seed:          42
  n_steps:   10000       # 5 sims × 5 snaps = 25 (sim, snap) pairs
  lr:         3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  log_every:    100
  save_every:   500

  loss_sc_boost:      1.0
  loss_density_boost: 0.0
  loss_density_gamma: 0.5

wandb:
  project: pm2nbody_multisim
  tags: [mlp, lagrangian, pretrain, multisim, multiepoch]
