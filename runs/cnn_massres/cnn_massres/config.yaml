# ==============================================================================
# cnn_massres.yaml
# CNN-WST mass-resolution force correction  (stage 1).
#
# Difference vs. force-resolution:
#   Force-resolution:   same N particles, different mesh  (128³ vs 256³ mesh)
#   Mass-resolution:    different N particles (e.g. 64³ vs 128³), each on their
#                       own mesh — corrects shot noise, small halos, tidal fields
#
# Target:
#   ΔF_mass_i = F_HR(q_i) − F_LR_i
#
# CNN output:  scalar potential ΔΦ per particle
# Force correction:  ΔF_CNN = ∇ΔΦ_CNN(x_LR)  (autograd of potential sum)
#
# Pipeline:
#   Stage 1:  python train_cnn_massres.py --config configs/cnn_massres.yaml
#   Stage 2:  python train_lag_massres.py --config configs/lag_massres.yaml
#             (set model.cnn_checkpoint to the stage-1 checkpoint.pkl)
# ==============================================================================

experiment:
  name: cnn_massres
  output_dir: runs/cnn_massres

data:
  data_dir: /cosmos_storage/home/diegovillalba/JaxPM/data_disp_test     # ← path to your simulation data
  mesh_lr:     64                  # LR mesh size
  mesh_hr:    128                  # HR mesh size (must equal n_particles_hr)
  box_size:   128.0                # Mpc/h
  n_particles: 64                  # LR particles per dimension (64³ total)

  sim_id_train: 0
  sim_id_val:   1
  snap_train:   5                  # a ≈ 0.6
  snaps_val:  [2, 5, 8]

model:
  type: cnn_wst                    # "cnn" (fast) or "cnn_wst" (better)

  # CNN architecture
  channels_hidden_dim: 32
  n_convolutions:       4
  n_fully_connected:    2
  kernel_size:          3
  pad_periodic:      true
  embed_globals:     true
  n_globals_embedding:  2
  globals_embedding_dim: 8
  global_conditioning: null
  use_attention_interpolation: false
  add_particle_velocities:     false

  # WST settings (only used for cnn_wst)
  wst_J: 2
  wst_L: 4

  # input_dim — must match C in build_grid_data:
  #   use_pm_potential=true  → C=2  → input_dim=2
  #   use_pm_potential=false → C=1  → input_dim=1
  # For cnn_wst, actual input_dim is computed dynamically (C + J*L)
  input_dim: 2

  # Use PM potential as additional grid channel (recommended: true)
  use_pm_potential: true

training:
  seed: 0
  n_steps: 10000
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 100
  log_every:    50
  save_every:  500

  # Per-particle loss weighting
  loss_sc_boost:      3.0          # up-weight shell-crossing particles
  loss_density_boost: 1.0
  loss_density_gamma: 0.5

wandb:
  project: pm2nbody_cnn_massres
  tags: [cnn_wst, massres, force, stage1]
