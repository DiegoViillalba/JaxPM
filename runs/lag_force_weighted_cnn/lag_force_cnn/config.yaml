# ==============================================================================
# lag_force_cnn_wst.yaml
# Lagrangian MLP residual experiment on top of a pre-trained CNN-WST.
#
# Target:  ΔF_i^res = F_ref_i − F_PM_i − ΔF_CNN_i
#
# The CNN-WST already captures Eulerian corrections (density field, tidal
# environment, scale-dependent growth).  This model learns what remains:
#   • Multi-streaming and shell-crossing effects
#   • Anisotropic collapse signals invisible in the density field
#   • Kinematic dispersion within halos
#
# If this residual MLP gives additional improvement over CNN-WST alone,
# the Lagrangian information is genuinely complementary.
#
# Diagnostic to watch
# -------------------
#  1. |ΔF_residual| vs |ΔF_raw|: how much is left after CNN?
#     If < 10% of raw, CNN explains most; Lagrangian adds fine corrections.
#  2. Pearson R of residual prediction: measures whether the deformation
#     tensor predicts the REMAINING error from the CNN.
#  3. Correlation between det(D) and |ΔF_residual|:
#     if shell-crossing regions have larger residuals, this experiment is
#     testing exactly the right signal.
# ==============================================================================

experiment:
  name: lag_force_cnn
  output_dir: runs/lag_force_weighted_cnn

data:
  data_dir: /cosmos_storage/home/diegovillalba/JaxPM/data/lagrangian_matched_128_512_L256.0_S50_Np128          # path to pos_m128_s0.npy etc.
  mesh_lr: 128
  mesh_hr: 512
  box_size: 256.0             # Mpc/h
  n_particles: 128            # particles per dimension  (128³ = 2M particles)          # particles per dimension  (128³ = 2M particles)

  sim_id_train: 0             # simulation used for training
  sim_id_val: 1               # simulation used for validation
  snap_train: 24              # training snapshot index  (a ≈ 0.5 for 50-snap datasets)
  snaps_val: [9, 24, 39]      # validate on early / mid / late snapshots

model:
  type: lag_force_mlp
  hidden_dim: 64              # hidden layer width
  n_layers: 3                 # number of hidden layers (total depth = n_layers + 1)
  output_mode: force          # "force" → [N,3] direct,  "potential" → [N,1] scalar
  use_strain: true            # use E=D−I (zero at IC, cleaner signal)
  use_invariants: true       # append [tr(D), det(D), ||E||_F] — try true if MLP plateaus
  use_velocity: true          # include particle velocity in the input
  use_scale_factor: true      # include scale factor a

  # Set to a run directory to compute the CNN-WST force first and train on residual.
  # Leave null for standalone mode.
  cnn_checkpoint: /cosmos_storage/home/diegovillalba/JaxPM/models/electric-dream-78/


training:
  seed: 0
  n_steps: 5000
  lr: 4.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 50
  log_every: 50               # steps between metrics + validation
  save_every: 200             # steps between checkpoint saves

  # ── Per-particle loss weighting ─────────────────────────────────────────
  # Upweights shell-crossing and high-density regions.
  #
  # Formula (normalised to mean=1):
  #   w_i = [1 + (sc_boost−1)·𝟙[det D_i < 0]]
  #         · (1 + density_boost · max(δ_i, 0))^density_gamma
  #
  # loss_sc_boost      : SC multiplier.   1.0 = off,  5.0 = SC counts 5×.
  # loss_density_boost : α in density term.  0.0 = off.
  # loss_density_gamma : exponent γ.  0.5 = sqrt (gentle),  1.0 = linear.
  loss_sc_boost:      8.0
  loss_density_boost: 2.0
  loss_density_gamma: 0.5

wandb:
  project: pm2nbody_lag_force
  tags: [lag_force, mlp, cnn_wst_residual, weighted_loss]
