# ==============================================================================
# lag_force_mlp.yaml
# Standalone Lagrangian MLP experiment — no CNN pre-conditioning.
#
# Target:  ΔF_i = F_ref_i − F_PM_i
#   F_PM  = PM force at mesh_lr resolution
#   F_ref = PM force at mesh_hr resolution (LR particles on HR mesh,
#           OR HR particles from dataset if available)
#
# The model learns to predict this residual from the LOCAL DEFORMATION TENSOR
# E = D − I (strain at the particle's Lagrangian neighbourhood).
#
# This experiment validates whether the deformation tensor is a useful signal.
# If Pearson R > 0.5 at training snapshot, the signal is there.
# If it generalises to other snapshots, it is physically meaningful.
# ==============================================================================

experiment:
  name: lag_force_mlp
  output_dir: runs/lag_force

data:
  data_dir: /cosmos_storage/home/diegovillalba/JaxPM/data/lagrangian_matched_128_512_L256.0_S50_Np128          # path to pos_m128_s0.npy etc.
  mesh_lr: 128
  mesh_hr: 512
  box_size: 256.0             # Mpc/h
  n_particles: 128            # particles per dimension  (128³ = 2M particles)

  sim_id_train: 0             # simulation used for training
  sim_id_val: 1               # simulation used for validation
  snap_train: 40              # training snapshot index  (a ≈ 0.5 for 50-snap datasets)
  snaps_val: [9, 40, 49]      # validate on early / mid / late snapshots

model:
  type: lag_force_mlp
  hidden_dim: 64              # hidden layer width
  n_layers: 3                 # number of hidden layers (total depth = n_layers + 1)
  output_mode: force          # "force" → [N,3] direct,  "potential" → [N,1] scalar
  use_strain: true            # use E=D−I (zero at IC, cleaner signal)
  use_invariants: false       # append [tr(D), det(D), ||E||_F] — try true if MLP plateaus
  use_velocity: true          # include particle velocity in the input
  use_scale_factor: true      # include scale factor a

  # Set to a run directory to compute the CNN-WST force first and train on residual.
  # Leave null for standalone mode.
  cnn_checkpoint: null

training:
  seed: 0
  n_steps: 1000
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 50
  log_every: 50               # steps between metrics + validation
  save_every: 200             # steps between checkpoint saves

wandb:
  project: pm2nbody_lag_force
  tags: [lag_force, mlp, standalone, single_snapshot]
