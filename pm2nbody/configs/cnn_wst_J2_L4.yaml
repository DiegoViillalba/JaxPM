correction_model:
  type: cnn_wst          # nuevo tipo
  wst_J: 3               # escalas: 2^1=2, 2^2=4 celdas — cubre halos pequeños
  wst_L: 8               # orientaciones: 4 direcciones en S²
                         # input_dim efectivo = 1 + J*L = 1 + 8 = 9
  channels_hidden_dim: 32
  n_convolutions: 3
  n_fully_connected: 2
  input_dim: 1           # se ignora para cnn_wst, se calcula automáticamente
  kernel_size: 3
  pad_periodic: true
  embed_globals: false
  n_globals_embedding: 1
  globals_embedding_dim: 64
  global_conditioning: add
  use_attention_interpolation: false
  add_particle_velocities: true
 
training:
  n_steps: 150
  patience: 15
  loss: mse_positions
  lambda_pos: 1.0
  lambda_velocity: 1.0
  lambda_pk: 0.0
  lambda_density: 0.0
  weight_snapshots: true
  seed: 0
  batch_size: 1
  checkpoint_every: 10
  weight_decay: 1.0e-4
  schedule:
    type: cosine
    initial_lr: 0.0
    peak_value: 5.0e-4
    warmup_steps: 5
    n_steps: 250
    min_lr: 3.0e-4
 
data:
  mesh_lr: 128
  mesh_hr: 256
  n_train_sims: 40
  n_val_sims: 1
  n_test_sims: 1
  box_size: 256.0
  n_snapshots: 50
  n_particles: 128
  snapshots: null
 
wandb:
  project: pm2nbody

